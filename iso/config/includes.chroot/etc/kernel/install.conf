# kAIrOS [D4]: the EFI partition carries exactly the loader entries kAIrOS writes
# (loader/entries/kairos.conf + kairos-serial.conf; kernel and initrd under
# /kairos). layout=other stops kernel-install — run by the kernel and
# initramfs-tools package hooks on every kernel/initramfs update, and by
# update-initramfs at build time — from adding Boot Loader Specification entries
# of its own: the Debian entry it wrote sorted FIRST (sort-key + version), so
# `bootctl list` marked "Debian GNU/Linux 13 (trixie)" the default and the kAIrOS
# cmdline (quiet, loglevel=0, vt.global_cursor_default=0, the console= order)
# never took effect on a real boot. The kAIrOS entry follows kernel upgrades
# through /etc/kernel/postinst.d and /etc/initramfs/post-update.d/zz-kairos-esp
# (-> /usr/local/sbin/kairos-esp-sync) instead.
layout=other
