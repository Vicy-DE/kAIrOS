# kAIrOS [fix 2026-10-22]: names (docs/FIXES-2026-10-22.md).
# rc-manager=symlink: NetworkManager writes /run/NetworkManager/resolv.conf and leaves /etc/resolv.conf alone while
#   it is a symlink — /etc/tmpfiles.d/kairos.conf links it there at every boot, so the image ships no resolv.conf of
#   its own (v7.5-3 carried the build VM's "nameserver 10.0.2.3") and the nameserver always comes from the network
#   the machine is on. It is what "auto" chose on the laptop (stick run 2026-10-16), now written down.
# hostname-mode=none: the hostname stays the one in /etc/hostname, which /etc/hosts names. NetworkManager treats
#   "localhost.localdomain" as unset and, by default, takes a hostname from DHCP or a reverse-DNS lookup of the
#   address (the stick log shows it looking on every device change); a changed hostname is no longer in /etc/hosts,
#   and X clients look their cookie up by the CURRENT hostname, so the one startx wrote under the old name would no
#   longer match for later X clients (games, the display API, the window layer).
[main]
rc-manager=symlink
hostname-mode=none
