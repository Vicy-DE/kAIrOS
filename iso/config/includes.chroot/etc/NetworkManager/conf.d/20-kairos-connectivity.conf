# kAIrOS [R78]: NetworkManager's connectivity check. Debian ships none (the optional package
# network-manager-config-connectivity-debian is not installed in the image), so NetworkManager
# could never tell a captive portal (WIFIonICE, hotel and cafe hotspots) from "online" and the
# OS could not offer the sign-in page. Same endpoint as that Debian package (checked 2026-10-07:
# HTTP 200, body "NetworkManager is online"): one small HTTP GET after every connect and every
# 5 minutes, nothing else is sent. A device behind a portal then reports IP4-CONNECTIVITY
# "portal" -> vibe.hw.wifi.status().connectivity, and vibe.hw.wifi.signin() opens the page.
[connectivity]
uri=http://network-test.debian.org/nm
response=NetworkManager is online
interval=300
