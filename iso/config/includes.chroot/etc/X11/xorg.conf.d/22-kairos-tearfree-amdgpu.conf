# kAIrOS [R90, fix 2026-10-24]: tear-free updates on the amdgpu desktop that spans two CRTCs.
#
# The one desktop (R90) is ONE Chromium window over every monitor — on the laptop a 4480x1440 window over the eDP
# (1920x1080) and the USB-C monitor (2560x1440), two CRTCs of the AMD 780M. The v7.5-4 card run (2026-10-24) logged
#   (WW) AMDGPU(0): flip queue failed: Invalid argument / Page flip failed / (EE) present flip failed
# 77 times in 28 min (the per-screen kiosks of v7.5-2: 0 in 13 h): Chromium presents the screen-sized window by DRI3
# page flips and the DDX flips the client's buffer onto both CRTCs at once; when the kernel refuses the flip (EINVAL)
# the frame is COPIED into the front buffer unsynchronised = a torn / stuttering frame.
#
# TearFree "on" (xserver-xorg-video-amdgpu 23.0.0 on the image, amdgpu(4)): the default of the per-output TearFree
# property. The driver's own default is "auto" = on only for rotated / transformed outputs and RandR 1.4 secondary
# outputs, i.e. OFF for the panel and the USB-C monitor (the Xorg log says "TearFree property default: auto"). With it
# on, every CRTC gets two scanout buffers of ITS OWN size: a client frame is copied into the CRTC's back buffer and
# that buffer is flipped at the CRTC's vblank — no shared 4480-px buffer is ever flipped onto a CRTC, every monitor
# updates tear-free, and the flip of a DDX-allocated buffer cannot fail on the client's buffer properties.
# Cost: one extra copy per frame and CRTC (a GPU blit, ~26 MB per full 4480x1440 frame), 2 more scanout buffers
# per CRTC (~16 MiB for 1920x1080, ~28 MiB for 2560x1440, in the iGPU's carve-out / GTT), up to one frame of
# added latency. Proof: only the card run — the boot log's `pageflip` check records the TearFree state and the count
# of "flip queue failed" lines in the session's Xorg log (before: auto / 77; expected after: on / 0).
#
# How the option reaches the driver: an OutputClass whose MatchDriver names the KERNEL driver (amdgpu) is merged into
# the autoconfigured device's options (xf86MergeOutputClassOptions, see 20-kairos-swcursor.conf; Debian's own
# 10-amdgpu.conf does the same for HotplugDriver) — the Xorg log then shows
#   Applying OutputClass "kAIrOS TearFree (amdgpu)" options to /dev/dri/cardN
#   (**) AMDGPU(0): Option "TearFree" "on"
#   (**) AMDGPU(0): TearFree property default: on
# Only amdgpu is matched: the modesetting driver of the VMs / Intel (20-kairos-swcursor.conf) and an NVIDIA boot
# GPU are untouched — a boot on any other GPU is exactly as before. The Driver line repeats what X picks anyway (an
# OutputClass without one puts a NULL into X's driver list).
# Off (no rebuild): rename this file to *.conf.disabled as root, then a new X session (`systemctl restart getty@tty1`).

Section "OutputClass"
    Identifier "kAIrOS TearFree (amdgpu)"
    MatchDriver "amdgpu"
    Driver "amdgpu"
    Option "TearFree" "on"
EndSection
