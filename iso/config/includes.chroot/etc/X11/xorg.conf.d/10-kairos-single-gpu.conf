# kAIrOS [R41/R50]: X runs on the boot GPU only — the one the firmware lit the panel/monitor
# with (boot_vga). A second GPU is never added as an extra "GPU screen": on the hybrid
# AMD+NVIDIA laptop that is what stalled X before the kiosk ever started (stick run
# 2026-10-06). An NVIDIA card that drives the monitor IS the boot GPU and is unaffected;
# outputs wired only to a secondary GPU stay dark (they need PRIME, never set up here).
Section "ServerFlags"
    Option "AutoAddGPU" "off"
EndSection
