# kAIrOS [R28/R51, R79]: the mouse pointer.
#
# amdgpu (the laptop's AMD 780M drives the panel): NO software cursor any more — the GPU's
# HARDWARE cursor plane draws the pointer (v7.5-1, docs/IMAGING-WORKFLOW-V75-1.md §cursor). v7.5
# forced Option "SWcursor" "on" here; on the owner's stick run (docs/STICK-RUN-2026-10-07-v75.md §2)
# the pointer then FLICKERED in the top ~1/6 of the screen: a software cursor is painted into X's
# front buffer, Chromium redraws the shell by KMS page flips (Xorg.0.log: "KMS Pageflipping:
# enabled", DRI3, glamor) and a flipped-in buffer does not carry the sprite — so it flickers
# wherever the shell repaints all the time (the menubar's ticking clock, search field, toasts).
# The hardware cursor plane is independent of page flips. The ROOT CAUSE of the old "no mouse
# pointer" reports was Xorg's -nocursor (removed from ~/.bash_profile in v7.5): xfixes/cursor.c
# ANDs every cursor display with it, so no sprite of either kind was ever drawn.
# FALLBACK (should the hardware cursor be invisible on some machine) — one line as root, then a
# new X session (`systemctl restart getty@tty1` or a reboot):
#   mv /etc/X11/xorg.conf.d/21-kairos-swcursor-amdgpu.conf.disabled /etc/X11/xorg.conf.d/21-kairos-swcursor-amdgpu.conf
#
# How the options get to the driver (xorg-server 21.1.16, the image's server):
# xf86CollectOptions() -> xf86MergeOutputClassOptions() merges the Option lines of every
# OutputClass whose MatchDriver matches the device's KERNEL driver into the screen's options,
# whichever X driver ends up driving it — Xorg.0.log: 'Applying OutputClass "…" options to
# /dev/dri/cardN' and '(**) …: Option "SWcursor" "on"'. MatchDriver is the kernel driver (amdgpu,
# i915, virtio_gpu …), never the X driver name, so a "MatchDriver modesetting" would match nothing.
# Every section keeps a Driver line: a matching OutputClass without one puts a NULL into X's driver
# list (xf86AddMatchedDriver). The Driver line repeats what X picks anyway (the autoconfigured
# modesetting driver), so the driver choice is unchanged. NVIDIA (nvidia-drm) is NOT matched: an
# NVIDIA boot GPU keeps its own driver and cursor; 10-kairos-single-gpu.conf (AutoAddGPU off) is
# untouched.

# the modesetting driver's devices: Intel (i915/xe, no intel DDX on the image) and the virtual
# GPUs of the testrig VMs (virtio-vga, QEMU std VGA) — the VM proof reads this section's lines
Section "OutputClass"
    Identifier "kAIrOS software cursor (modesetting)"
    MatchDriver "i915|xe|virtio_gpu|bochs|bochs-drm"
    Driver "modesetting"
    Option "SWcursor" "on"
EndSection
