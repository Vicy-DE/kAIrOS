# kAIrOS [R41/R50]: the NVIDIA DISPLAY modules load only when kairos-gpu-setup asks for them,
# i.e. when the NVIDIA card drives the monitor (boot_vga). nvidia_drm carries a PCI alias for
# every NVIDIA GPU, so udev's coldplug autoloaded it (+ its dependency nvidia_modeset) on the
# hybrid AMD+NVIDIA laptop as well: /dev/dri/card1 appeared while X was starting, X added the
# 4070 as a second "GPU screen", failed ("modeset(G0): Failed to create pixmap") and never
# finished starting — no kiosk (stick run 2026-10-06, docs/STICK-RUN-2026-10-06.md).
# A blacklist only stops alias autoloading: kairos-gpu-setup's explicit
# `modprobe nvidia_drm modeset=1` (NVIDIA = boot GPU) still works; compute (nvidia, nvidia_uvm)
# is untouched.
blacklist nvidia_drm
blacklist nvidia_modeset
