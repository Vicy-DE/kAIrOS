# [R51] a failed local mount (root, or a fstab line that is not nofail) drops to emergency
# mode; also write a diagnostics log so the reason is readable from the stick.
# Drop-ins ADD to OnFailure= (emergency.target stays). Own handler instance per
# trigger (%n = local-fs.target), see kairos-bootlog-failure@.service.
[Unit]
OnFailure=kairos-bootlog-failure@%n.service
