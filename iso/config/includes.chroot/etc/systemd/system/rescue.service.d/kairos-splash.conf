# kAIrOS [R51/R73]: the boot screen painter holds tty1 in graphics mode. A drop to
# rescue mode (failed root/ESP mount, fsck, a broken unit) must be READABLE: stop the
# painter and restore the text console before sulogin prints its prompt. Additive
# ExecStartPre=, "-" = never fails the shell. kairos-bootlog-emergency has already
# written its capture to the stick by then (Before=rescue.service).
[Service]
ExecStartPre=-/usr/local/sbin/kairos-splash --stop
