# kAIrOS [R51] X retry pacing on tty1. getty@tty1 -> autologin -> ~/.bash_profile
# -> startx: when X dies at once, agetty's Restart=always/RestartSec=0 re-runs the
# login shell immediately, and the stock start-rate limit (5 starts in 10 s) put
# getty@tty1 into start-limit-hit after the 5th failure — BEFORE .bash_profile's
# 6th attempt could flag the loop for kairos-bootlog-xfail.path: no capture, X
# dead until reboot (D8). .bash_profile now paces its retries (sleep 3 between
# attempts 2-5, 30 s from the 6th on): the paced loop stays far below this
# widened limit, while a login shell that exits WITHOUT pacing (a broken
# .bash_profile) still trips it — never a hot loop on tty1. The numbers here and
# the sleeps in .bash_profile are checked against each other by the test suite.
[Unit]
StartLimitIntervalSec=60
StartLimitBurst=20
