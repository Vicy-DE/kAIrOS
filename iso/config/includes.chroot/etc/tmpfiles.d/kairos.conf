# kAIrOS [R51]: the kiosk user's X log (startx/Xorg/.xinitrc output, collected by
# kairos-bootlog) and the per-boot X attempt counter / X-loop flag (tmpfs).
d /var/log/kairos 0755 kairos kairos -
d /run/kairos     0755 kairos kairos -
# [fix 2026-10-22] NetworkManager owns /etc/resolv.conf: a symlink to the file it keeps in /run (tmpfs), so no
# image carries a resolv.conf baked by the machine it was built on (v7.5-3 shipped "nameserver 10.0.2.3", the
# build VM's QEMU DNS) and nothing written at runtime lands on the root FS. L+ replaces a regular file at boot,
# before NetworkManager starts; until NetworkManager writes its file the link dangles and glibc asks the local
# host, where nothing answers: a lookup fails at once instead of waiting on a stale server.
# /etc/NetworkManager/conf.d/20-kairos-dns.conf: rc-manager=symlink.
L+ /etc/resolv.conf - - - - /run/NetworkManager/resolv.conf
